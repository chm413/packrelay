# packrelay 仓库元数据 —— 单一真相源。
#
# GitHub 的 description / topics 不随 git 推送走，只存在于仓库设置里。
# 把它们写在这里，是为了让「仓库该怎么介绍自己」能像代码一样被 review、被回滚、
# 被 CI 校验，而不是散落在某次网页点击里。
#
# 改完执行：scripts/sync-repo-metadata.sh
# 校验（不改）：scripts/sync-repo-metadata.sh --check
#
# 约束（GitHub 侧）：
#   - topics 只允许小写字母 / 数字 / 连字符，每个 ≤ 50 字符，最多 20 个
#   - description ≤ 350 字符，homepage 必须是 http(s) 绝对地址或留空

REPO_SLUG='chm413/packrelay'

REPO_DESCRIPTION='LeviLamina/BDS 资源包自动维护与分发：扫描变更 → git push → GitHub Actions 打 Release → 把 CDN 地址直接写进 BDS 内存'

# 没有项目主页，留空即可
REPO_HOMEPAGE=''

# 注意 minecraft-bedrock 不是 GitHub 上存在的 topic（/topics/minecraft-bedrock 返回 404），
# 生态里实际流通的是 minecraft-bedrock-modding；GitHub 的 topic 输入框也只让你从已有
# topic 里选。所以这里用后者。
REPO_TOPICS='minecraft minecraft-bedrock-modding levilamina bds resource-pack cdn github-actions cpp20'
